name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fedora:
    name: Fedora RPM (x86_64)
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make autoconf automake libtool pkgconf-pkg-config SDL3-devel git \
            libpng-devel libpcap-devel readline-devel \
            rpm-build rpmdevtools desktop-file-utils libappstream-glib
      - uses: actions/checkout@v4
      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure, build, and test
        run: |
          autoreconf -iv
          ./configure --prefix=/usr --without-ffmpeg
          make -j$(nproc)
          make -C tests check
      - name: Build RPM from source archive
        run: |
          rpmdev-setuptree
          make dist
          cp 1989-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bb 1989.spec
          mkdir -p dist/rpm
          find ~/rpmbuild/RPMS -name '1989-[0-9]*.rpm' -exec cp {} dist/rpm/ \;
          test -n "$(find dist/rpm -name '1989-[0-9]*.rpm' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: 1989-fedora-x86_64-rpm
          path: dist/rpm/*.rpm
          if-no-files-found: error

  debian:
    name: Debian DEB (amd64)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc g++ make autoconf automake libtool pkg-config libsdl3-dev dpkg-dev \
            libpng-dev libpcap-dev libreadline-dev \
            desktop-file-utils appstream-util git ca-certificates
      - uses: actions/checkout@v4
      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure, build, and test
        run: |
          autoreconf -iv
          ./configure --prefix=/usr --without-ffmpeg
          make -j$(nproc)
          make -C tests check
          desktop-file-validate io.github.salvogendut.Emulator1989.desktop
          appstream-util validate-relax --nonet io.github.salvogendut.Emulator1989.metainfo.xml
      - name: Build and inspect DEB
        run: |
          sh packaging/debian/build-deb.sh dist/deb
          dpkg-deb --contents dist/deb/*.deb
          dpkg-deb --field dist/deb/*.deb Depends
      - uses: actions/upload-artifact@v4
        with:
          name: 1989-debian-amd64-deb
          path: dist/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows (MinGW x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 and SDL3
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-libpng
            autoconf
            automake
      - name: Configure and build
        run: |
          git config --global --add safe.directory "$(pwd -W)"
          autoreconf -iv
          ./configure --without-ffmpeg
          make -k -j$(nproc)
      - name: Stage portable bundle
        run: |
          sh packaging/windows/package.sh dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: 1989-windows-x86_64
          path: dist/windows/
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install autoconf automake pkg-config sdl3 libpng libpcap readline dylibbundler
      - name: Locate Homebrew optional libraries
        run: echo "PKG_CONFIG_PATH=$(brew --prefix libpcap)/lib/pkgconfig:$(brew --prefix readline)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Configure, build, and test
        run: |
          autoreconf -iv
          ./configure --without-ffmpeg
          make -j$(sysctl -n hw.logicalcpu)
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy make -C tests check
      - name: Package app bundle
        run: |
          version="$(sed -n 's/^PACKAGE_VERSION = //p' Makefile)"
          sh packaging/macos/package.sh ./1989 dist/1989.app "$version"
          dist/1989.app/Contents/MacOS/ditool -h
          lipo dist/1989.app/Contents/MacOS/1989 -verify_arch ${{ matrix.arch }}
          ditto -c -k --sequesterRsrc --keepParent \
            dist/1989.app "dist/1989-${version}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 1989-macos-${{ matrix.arch }}
          path: dist/1989-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak from this checkout
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: 1989.flatpak
          manifest-path: packaging/io.github.salvogendut.Emulator1989.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: 1989-flatpak-x86_64
          path: 1989.flatpak
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [fedora, debian, windows, macos, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          set -eu
          source_version=$(sed -n 's/^AC_INIT(\[1989\], \[\([^]]*\)\].*/\1/p' configure.ac)
          rpm_version=$(sed -n 's/^Version:[[:space:]]*//p' 1989.spec)
          test -n "$source_version"
          test "$source_version" = "$rpm_version"
          test "$GITHUB_REF_NAME" = "v$source_version"
          grep -F "1989 $source_version" 1989.1
          grep -F "<release version=\"$source_version\"" io.github.salvogendut.Emulator1989.metainfo.xml
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          set -eu
          mkdir assets
          cp artifacts/1989-fedora-x86_64-rpm/*.rpm assets/
          cp artifacts/1989-debian-amd64-deb/*.deb assets/
          cp artifacts/1989-macos-arm64/*.zip assets/
          cp artifacts/1989-macos-x86_64/*.zip assets/
          cp artifacts/1989-flatpak-x86_64/1989.flatpak \
            "assets/1989-${GITHUB_REF_NAME#v}-x86_64.flatpak"
          (cd artifacts/1989-windows-x86_64 && \
            zip -r "../../assets/1989-${GITHUB_REF_NAME#v}-windows-x86_64.zip" .)
          test "$(find assets -type f | wc -l)" -eq 6
          (cd assets && sha256sum * > SHA256SUMS)
          ls -la assets/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: assets/*
          generate_release_notes: true
