name: WebAssembly

on:
  push:
    branches: [main, 3-webassembly-next-theme]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Emscripten 6.0.6
        run: |
          git clone --depth 1 --branch 6.0.6 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.6
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.6
      - name: Build SDL3/WebAssembly edition
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make -C web -j2
      - name: Install browser test tools
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test ROM boot, input and media
        working-directory: web
        run: |
          npm test
          npm run test:browser
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: 1989-web-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1989-web-test-results
          path: web/test-results/
          if-no-files-found: ignore
